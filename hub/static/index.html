<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="W1tqx12RYFZgJCboIGT0zb">
<head data-page-node-id="9J4ggEqtqFkAFGnMeZPGF5">
<meta charset="utf-8" data-page-node-id="shcjyBLG0kZxmZQavgpRou">
<meta name="viewport" content="width=device-width, initial-scale=1" data-page-node-id="kaC7CJAJs0yngYQYK2oGWn">
<title>CORE-BUSY 遥测后台</title>
<style>
  /* 与软件主界面同源色板（src/CoreBusy.App/Themes/Colors.xaml，Fluent 2 深色令牌） */
  :root {
    --bg:#1A1A1A; --panel:#232323; --card:#2B2B2B; --hover:#333333;
    --bd:#3D3D3D; --bd2:#2E2E2E;
    --tx:#F2F2F2; --tx2:#A6A6A6; --tx3:#737373;
    --ac:#4CA0E0; --blue:#6FA8DC; --ok:#4EC48F; --warn:#E8C044; --org:#E8934A; --dg:#E5484D;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 "Segoe UI","Microsoft YaHei",sans-serif; color:var(--tx); background:var(--bg); }
  header { display:flex; align-items:center; gap:12px; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--bd); }
  header h1 { font-size:16px; font-weight:500; margin:0; }
  header .sp { flex:1; }
  header input { width:230px; padding:5px 9px; border:1px solid var(--bd); border-radius:8px; font:inherit; background:var(--card); color:var(--tx); }
  header input::placeholder { color:var(--tx3); }
  header button { padding:5px 14px; border:1px solid var(--bd); border-radius:8px; background:var(--card); color:var(--tx); cursor:pointer; font:inherit; }
  header button:hover { border-color:var(--ac); color:var(--ac); background:var(--hover); }
  main { padding:18px 24px; max-width:1280px; margin:0 auto; }
  table { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--bd2); border-radius:12px; overflow:hidden; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid var(--bd2); white-space:nowrap; }
  th { font-weight:500; color:var(--tx2); background:var(--bg); font-size:13px; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--hover); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .dim { color:var(--tx2); }
  /* 逐核等级徽章：语义色取自软件 Brushes.xaml 半透明变体（26/33 alpha） */
  .badge { display:inline-block; padding:0 7px; margin:1px 2px; border:1px solid var(--bd); border-radius:9px; font-size:12px; background:var(--card); color:var(--tx2); }
  .b0 { border-color:var(--bd); }
  .b1 { background:#264EC48F; border-color:#4EC48F; color:#7BDCB2; }
  .b2 { background:#266FA8DC; border-color:#6FA8DC; color:#9DC4EC; }
  .b3 { background:#26E8934A; border-color:#E8934A; color:#F0B684; }
  .b4 { background:#33E8C044; border-color:#E8C044; color:#F0D484; }
  #admin { margin-bottom:16px; background:var(--panel); border:1px solid var(--bd2); border-radius:12px; padding:14px 20px; }
  #admin h2 { font-size:14px; font-weight:500; margin:0 0 8px; display:flex; align-items:center; gap:12px; }
  #admin button { padding:4px 12px; border:1px solid var(--bd); border-radius:8px; background:var(--card); color:var(--tx); cursor:pointer; font:inherit; font-size:13px; }
  #admin button:hover { border-color:var(--ac); color:var(--ac); }
  #admin .invite { display:inline-block; margin:2px 6px 2px 0; padding:2px 10px; border:1px solid var(--bd); border-radius:8px; font-size:13px; font-family:Consolas,monospace; }
  #admin .invite .st { margin-left:8px; font-size:12px; }
  #admin .invite.active { border-color:var(--ac); color:var(--ac); }
  #admin .invite.used { color:var(--tx3); }
  #admin .invite.expired { border-color:var(--dg); color:var(--dg); }
  #admin .invite .x { margin-left:6px; cursor:pointer; }
  #admin .hint { font-size:12px; color:var(--tx3); margin-top:6px; }
  #detail { display:none; margin-top:16px; background:var(--panel); border:1px solid var(--bd2); border-radius:12px; padding:16px 20px; }
  #detail h2 { font-size:14px; font-weight:500; margin:0 0 8px; }
  #detail .close { float:right; cursor:pointer; color:var(--tx2); border:none; background:none; font-size:14px; }
  #detail .close:hover { color:var(--dg); }
  .kv { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:6px 18px; margin:10px 0; }
  .kv div { font-size:13px; } .kv b { font-weight:500; color:var(--tx2); margin-right:6px; }
  #err { color:var(--dg); padding:8px 0; }
  svg.chart { width:100%; height:120px; border:1px solid var(--bd2); border-radius:8px; background:var(--card); }
  .legend { font-size:12px; color:var(--tx2); margin:4px 0 12px; }
  .sw { display:inline-block; width:10px; height:3px; vertical-align:middle; margin:0 4px 2px 12px; }
  #detail .act { margin-right:8px; padding:3px 12px; border:1px solid var(--bd); border-radius:8px; background:var(--card); color:var(--tx); cursor:pointer; font:inherit; font-size:12px; }
  #detail .act:hover { border-color:var(--ac); color:var(--ac); }
  #detail .act.danger:hover { border-color:var(--dg); color:var(--dg); }
</style>
</head>
<body data-page-node-id="MKhBbnhncDRAiNxvMFeXui">
<header data-page-node-id="jFF1CxTujCK9peExiLkUuZ">
  <h1 data-page-node-id="UvrsCjs07yeexiwtflUfWJ">CORE-BUSY 遥测后台</h1>
  <span class="sp" data-page-node-id="Nf2Ekkwj0LyCv6tCwKjfcj"></span>
  <input id="token" type="password" placeholder="访问 Token" data-page-node-id="OwGkeEZaVlCyn5JfwAwVuc">
  <button onclick="saveTokenAndLoad()" data-page-node-id="Fr9QEvBogEYGpI6qSdTV0G">连接</button>
</header>
<main data-page-node-id="Sp7TrDCvT1djyMfsqRP2cG">
  <div id="err" data-page-node-id="cAQDQLq7Avtg3N5NXtQMnX"></div>
  <section id="admin" style="display:none" data-page-node-id="ifPaIqzvUlBusPQYfWTCWo">
    <h2 data-page-node-id="q5p8GMPIDNukBINYS8Ow0j">注册码管理 <button onclick="createInvite()" data-page-node-id="jjfqJJM9vOM4PaLuL1kCOt">生成注册码</button></h2>
    <div id="invites" data-page-node-id="ycBMOWonbUBCCEoqYAOlrs"><span class="dim" data-page-node-id="FNBBwLOusFbSkJaDnzvHMY">-</span></div>
    <div class="hint" data-page-node-id="uypSk8oFD3WkyL3VFERVkq">注册码一次性使用，24 小时过期。在设备端「设置 → 遥测上报」输入注册码一键注册，自动换取设备专属 Token；设备 Token 可在设备详情里换发或吊销。</div>
  </section>
  <table data-page-node-id="ASS0Pb9DntcBuxtoXC29co">
    <thead data-page-node-id="G7DmswS4BqiChohWKChJVr"><tr data-page-node-id="iTT75tjkL0v0Bd6bwFwMxa">
      <th data-page-node-id="ho2NKdpdbjvey5YBLdcPbs">设备</th><th data-page-node-id="LJW1Fl0yCukHDjKCWY3MCN">CPU</th><th data-page-node-id="FC2Aw14j7zhNQRzJsxc5M3">系统 / 版本</th><th data-page-node-id="bdsDub5sxxiuwwroIcLkA9">最近在线</th>
      <th class="num" data-page-node-id="JRA09MpAsg6BartfsprKkO">累计运行</th><th class="num" data-page-node-id="BoS3k0nPE9YBJfpp9MNpYe">累计功耗</th>
      <th class="num" data-page-node-id="G8sIdREL5ueC3Da92kI0uf">上次功耗</th><th class="num" data-page-node-id="4i1jeUIjXcqEPFU4s6Lfdv">峰值功耗</th><th data-page-node-id="ZW8OYZ2XAclZS1rO2VFIAr">逐核等级</th>
    </tr></thead>
    <tbody id="rows" data-page-node-id="HPtQNBMYRVGjCUSEIznzXg"><tr data-page-node-id="bXPv31D64Sh3gDPRmbHGxE"><td colspan="9" class="dim" data-page-node-id="sZf2ggdSet2nCEEFyLGuIf">加载中…</td></tr></tbody>
  </table>
  <div id="detail" data-page-node-id="Vy9iiYGdn9FJDjMc5Kp59A"></div>
</main>
<script>
"use strict";
const STAGES = ["幼体","成长期","成熟期","究极期","传说"];
const INVITE_ST = { active:"有效", used:"已用", expired:"已过期" };
const $ = id => document.getElementById(id);

function token() { return localStorage.getItem("corebusy_hub_token") || ""; }
function fmtDur(s) {
  if (s == null) return "-";
  s = Math.round(s);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  if (d > 0) return d + " 天 " + h + " 小时";
  if (h > 0) return h + " 小时 " + m + " 分";
  return m + " 分";
}
function fmtWh(v) {
  if (v == null) return "-";
  return v >= 1000 ? (v/1000).toFixed(2) + " kWh" : v.toFixed(1) + " Wh";
}
function fmtW(v) { return v == null ? "-" : v.toFixed(1) + " W"; }
function fmtSeen(ts) {
  if (!ts) return "-";
  const dt = new Date(ts), diff = (Date.now() - dt.getTime()) / 1000;
  const abs = dt.toLocaleString();
  if (diff < 900) return abs + "（刚刚）";
  if (diff < 86400) return abs + "（" + Math.round(diff/60) + " 分钟前）";
  return abs + "（" + Math.round(diff/86400) + " 天前）";
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "-" : String(s); return d.innerHTML; }
function gradesBadges(list) {
  if (!list || !list.length) return '<span class="dim">-</span>';
  return list.map(g => {
    const st = g.stage != null ? STAGES[g.stage] || g.stage : "-";
    const lv = g.level != null ? "Lv" + g.level : "";
    return '<span class="badge b' + (g.stage ?? 0) + '" title="' + esc(g.name) + ' ' + (g.score==null?"未判定":"健康 "+g.score.toFixed(0)) + '">'
      + esc(g.name) + " " + st + (lv ? " " + lv : "") + "</span>";
  }).join("");
}
async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "X-Token": token() } }, opts || {}));
  if (res.status === 401) throw new Error("Token 无效，请重新输入");
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
function renderDevices(devs) {
  $("rows").innerHTML = devs.length ? devs.map(d => {
    const id = esc(d.device_id);
    const cpu = esc(d.cpu_model || "-")
      + (d.cores_logical ? ' <span class="dim">' + d.cores_physical + "C" + d.cores_logical + "T"
        + (d.hybrid ? " 混合" : "") + "</span>" : "");
    const sys = esc(d.os || "-") + ' <span class="dim">v' + esc(d.app_version || "?") + "</span>";
    return "<tr onclick=\"showDetail('" + id + "')\">"
      + "<td><b>" + esc(d.alias || "(未命名)") + "</b><br><span class='dim' style='font-size:12px'>" + id + "</span></td>"
      + "<td>" + cpu + "</td><td>" + sys + "</td><td>" + fmtSeen(d.last_seen) + "</td>"
      + "<td class='num'>" + fmtDur(d.runtime_total) + "</td>"
      + "<td class='num'>" + fmtWh(d.energy_total) + "</td>"
      + "<td class='num'>" + fmtW(d.power_last) + "</td>"
      + "<td class='num'>" + fmtW(d.power_peak) + "</td>"
      + "<td style='max-width:340px;white-space:normal'>" + gradesBadges(safeGrades(d.cores_grade)) + "</td></tr>";
  }).join("") : '<tr><td colspan="9" class="dim">暂无设备上报</td></tr>';
}
function safeGrades(text) { try { return text ? JSON.parse(text) : null; } catch { return null; } }

// -- 注册码管理 ---------------------------------------------------------------
async function loadInvites() {
  $("admin").style.display = "block";
  try {
    const list = (await api("/api/admin/invites")).invites || [];
    $("invites").innerHTML = list.length ? list.map(i =>
      '<span class="invite ' + i.status + '">' + esc(i.code)
      + '<span class="st">' + (INVITE_ST[i.status] || i.status) + "</span>"
      + (i.status === "active" ? '<span class="x" title="删除" onclick="delInvite(\'' + esc(i.code) + '\')">✕</span>' : "")
      + "</span>"
    ).join("") : '<span class="dim">暂无注册码</span>';
  } catch (e) { $("invites").innerHTML = '<span class="dim">' + esc(e.message) + "</span>"; }
}
async function createInvite() {
  try { await api("/api/admin/invites", { method: "POST" }); loadInvites(); }
  catch (e) { $("err").textContent = e.message; }
}
async function delInvite(code) {
  try { await api("/api/admin/invites/" + code, { method: "DELETE" }); loadInvites(); }
  catch (e) { $("err").textContent = e.message; }
}
async function deviceAction(id, action) {
  const verb = action === "revoke" ? "吊销后该设备将无法上报，直到重新注册或换发。" : "换发后旧 Token 立即失效。";
  if (!confirm(action === "revoke" ? "确认吊销该设备 Token？" + verb : "确认换发该设备 Token？" + verb)) return;
  try {
    const r = await api("/api/admin/devices/" + id + "/" + action, { method: "POST" });
    $("err").textContent = "";
    alert(action === "revoke" ? "已吊销。" : "新 Token（请到设备设置页更新）:\n" + (r.token || ""));
  } catch (e) { $("err").textContent = e.message; }
}

async function showDetail(id) {
  try {
    const d = await api("/api/devices/" + id);
    const grades = safeGrades(d.cores_grade);
    const hist = d.history || [];
    let html = '<button class="close" onclick="$(\'detail\').style.display=\'none\'">关闭 ✕</button>'
      + "<h2>" + esc(d.alias || "(未命名)") + " <span class='dim'>" + esc(id) + "</span></h2>"
      + '<button class="act" onclick="deviceAction(\'' + id + '\',\'rotate\')">换发 Token</button>'
      + '<button class="act danger" onclick="deviceAction(\'' + id + '\',\'revoke\')">吊销 Token</button>'
      + '<div class="kv">'
      + "<div><b>CPU</b>" + esc(d.cpu_model || "-") + "</div>"
      + "<div><b>核心</b>" + (d.cores_physical ?? "-") + "C" + (d.cores_logical ?? "-") + "T" + (d.hybrid ? "（混合架构）" : "") + "</div>"
      + "<div><b>系统</b>" + esc(d.os || "-") + "</div>"
      + "<div><b>版本</b>" + esc(d.app_version || "-") + "</div>"
      + "<div><b>首次上线</b>" + fmtSeen(d.first_seen) + "</div>"
      + "<div><b>最近在线</b>" + fmtSeen(d.last_seen) + "</div>"
      + "<div><b>累计运行</b>" + fmtDur(d.runtime_total) + "</div>"
      + "<div><b>累计功耗</b>" + fmtWh(d.energy_total) + "</div>"
      + "<div><b>上次功耗</b>" + fmtW(d.power_last) + "</div>"
      + "<div><b>峰值功耗</b>" + fmtW(d.power_peak) + "</div>"
      + "</div>"
      + (grades ? "<h2>逐核等级（最新）</h2><div>" + gradesBadges(grades) + "</div>" : "");
    if (hist.length >= 2) html += chartHtml(hist);
    $("detail").innerHTML = html;
    $("detail").style.display = "block";
    $("detail").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) { $("err").textContent = e.message; }
}
function chartHtml(hist) {
  const rows = hist.slice().reverse();
  const W = 800, H = 120, P = 8;
  const xs = i => P + i * (W - 2*P) / (rows.length - 1);
  const line = (pick) => {
    const vals = rows.map(pick).filter(v => v != null);
    if (vals.length < 2) return "";
    const lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
    return rows.map((r, i) => r == null ? "" :
      (i ? "L" : "M") + xs(i).toFixed(1) + " " + (H - P - (pick(r) - lo) / span * (H - 2*P)).toFixed(1)
    ).join(" ");
  };
  return "<h2>历史曲线（最近 " + rows.length + " 次心跳）</h2>"
    + '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none">'
    + '<path d="' + line(r => r.runtime_total) + '" fill="none" stroke="#4CA0E0" stroke-width="1.5"/>'
    + '<path d="' + line(r => r.energy_total) + '" fill="none" stroke="#4EC48F" stroke-width="1.5"/>'
    + "</svg>"
    + '<div class="legend">时间 →<span class="sw" style="background:#4CA0E0"></span>累计运行<span class="sw" style="background:#4EC48F"></span>累计功耗</div>';
}
async function load() {
  $("err").textContent = "";
  try {
    renderDevices((await api("/api/devices")).devices);
    loadInvites();
  }
  catch (e) { $("err").textContent = e.message; }
}
function saveTokenAndLoad() { localStorage.setItem("corebusy_hub_token", $("token").value.trim()); load(); }
$("token").value = token();
if (token()) load(); else $("err").textContent = "请输入后台 Token（服务端 data/token.txt 或部署时设定）";
setInterval(() => { if (token()) load(); }, 60000);
</script>
</body>
</html>
